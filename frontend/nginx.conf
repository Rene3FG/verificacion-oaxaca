# Este archivo se instala como /etc/nginx/conf.d/default.conf, que nginx incluye
# dentro de http { }: por eso limit_req_zone puede declararse aquí arriba.

# PENDIENTES X1: límite de peticiones de login por IP. Complementa el bloqueo
# por usuario del backend (5 fallos, 15 min). 30 por minuto con ráfaga de 10
# deja pasar a varias estaciones iniciando turno a la vez y frena una prueba
# masiva de contraseñas. Ajustar rate y burst si hace falta.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

# PENDIENTES X3: todo el tráfico va por HTTPS. El puerto 80 solo redirige.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Validación HTTP-01 de Let's Encrypt. Solo se usa en el VPS con dominio y
    # certificado público; en la red local del verificentro no se invoca nunca.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # La redirección asume que el HTTPS se publica en el puerto estándar 443.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Certificado y llave montados desde el host (ver docker-compose.prod.yml y
    # scripts/generar_certificados.sh). Con certificado público (Let's Encrypt)
    # se montan copias llamadas server.crt (cadena completa) y server.key.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS queda desactivado a propósito: con una CA propia, un certificado
    # vencido o con nombre equivocado dejaría las estaciones sin poder siquiera
    # saltar el aviso. Activarlo (con el max-age que se decida) solo cuando la
    # renovación de certificados ya sea rutina:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/security-headers.conf;

    # El frontend y la API comparten origen: no hace falta CORS (PENDIENTES X4).
    # No agregar CORS en producción; si el frontend se sirviera desde otro
    # origen habría que usar una lista blanca explícita, nunca "*".

    # Login con límite por IP. Las directivas proxy se repiten porque un
    # location no hereda las de otro. El 429 devuelve JSON con "detail" para
    # que la pantalla muestre el motivo en vez de un mensaje de permisos.
    location = /api/estaciones/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @login_demasiados;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # IP real del cliente: se reemplaza X-Forwarded-For en vez de añadir
        # a lo que mande el cliente, que podría falsificarlo (PENDIENTES X1).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @login_demasiados {
        default_type application/json;
        return 429 '{"detail":"Demasiados intentos de inicio de sesión desde este equipo. Espera un minuto."}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: cualquier ruta del router devuelve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
