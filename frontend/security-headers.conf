# Cabeceras de seguridad (PENDIENTES X4). Se incluye en el server y en cada
# location que usa add_header: nginx NO hereda add_header del nivel superior
# cuando un location define el suyo, por eso este archivo se repite con include.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP en modo ENFORCING: el navegador bloquea lo que no cumple la política.
# Antes de endurecerla se probó con el frontend compilado: login, las cinco
# vistas y la vista previa del certificado (abre un PDF como blob: en otra
# pestaña, que hereda esta política; por eso object-src admite blob:).
# 'unsafe-inline' en style-src: Vuetify escribe estilos en línea.
# Si algo se rompe en producción, volver a la cabecera
# "Content-Security-Policy-Report-Only" (mismo valor) para diagnosticar sin bloquear.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
