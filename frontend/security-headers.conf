# Cabeceras de seguridad (PENDIENTES X4). Se incluye en el server y en cada
# location que usa add_header: nginx NO hereda add_header del nivel superior
# cuando un location define el suyo, por eso este archivo se repite con include.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# La CSP va en modo SOLO REPORTE hasta probarla en un navegador real: no
# bloquea nada, pero el navegador anota en la consola cada recurso que
# bloquearía (login, las cinco vistas y la vista previa del certificado, que
# abre un PDF como blob:). Con la consola limpia, cambiar el nombre de la
# cabecera a "Content-Security-Policy" para que se aplique.
# 'unsafe-inline' en style-src: Vuetify escribe estilos en línea.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
