# Producción: sin código montado, sin --reload, Postgres y Redis solo en la red
# interna. Uso:  cp .env.prod.example .env.prod  (editar)  y
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# El TLS se termina delante (proxy inverso del verificentro o balanceador):
# este compose publica HTTP en WEB_PORT (PENDIENTES X3).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      EQUIPO_GATEWAY_MODO: ${EQUIPO_GATEWAY_MODO:-manual}
      CENTRAL_SYNC_URL: ${CENTRAL_SYNC_URL:-}
      CENTRAL_SYNC_TOKEN: ${CENTRAL_SYNC_TOKEN:-}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_BLOQUEO_MIN: ${LOGIN_BLOQUEO_MIN:-15}
      SESION_INACTIVIDAD_MIN: ${SESION_INACTIVIDAD_MIN:-30}
      TZ: America/Mexico_City
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
