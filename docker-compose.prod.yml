# Producción: sin código montado, sin --reload, Postgres y Redis solo en la red
# interna. Uso:  cp .env.prod.example .env.prod  (editar)  y
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# El TLS se termina en el nginx del servicio web (PENDIENTES X3): antes de
# levantar, generar los certificados con scripts/generar_certificados.sh (quedan
# en ./certs/server). El puerto 80 solo redirige a HTTPS.
# Rotación de logs de Docker (D7): sin esto crecen sin límite en el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    logging: *logging
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env.prod}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env.prod}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      EQUIPO_GATEWAY_MODO: ${EQUIPO_GATEWAY_MODO:-manual}
      CENTRAL_SYNC_URL: ${CENTRAL_SYNC_URL:-}
      CENTRAL_SYNC_TOKEN: ${CENTRAL_SYNC_TOKEN:-}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_BLOQUEO_MIN: ${LOGIN_BLOQUEO_MIN:-15}
      SESION_INACTIVIDAD_MIN: ${SESION_INACTIVIDAD_MIN:-30}
      # X1-a: tope de fallos por IP; X2-a: vida máxima de una sesión (horas).
      LOGIN_MAX_INTENTOS_IP: ${LOGIN_MAX_INTENTOS_IP:-20}
      SESION_DURACION_MAX_H: ${SESION_DURACION_MAX_H:-12}
      # X4-d / X5-b: apaga /docs y bloquea los seeds de demostración.
      APP_ENV: production
      TZ: America/Mexico_City
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Solo server.crt y server.key: la llave de la CA nunca se monta aquí.
      # create_host_path: false hace que `up` falle con un error claro si falta
      # la carpeta, en vez de crear una vacía y dejar a nginx reiniciándose.
      - type: bind
        source: ${CERTS_DIR:-./certs/server}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend

volumes:
  db_data:
